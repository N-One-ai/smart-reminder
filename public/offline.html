<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Reminder — Mất kết nối</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #ffffff;
        color: #1e2e22;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #4db262;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
      }
      .icon svg { width: 28px; height: 28px; }
      h1 { font-size: 18px; font-weight: 700; }
      p { font-size: 14px; color: #6b7a70; max-width: 280px; }
      button {
        margin-top: 12px;
        padding: 10px 20px;
        border-radius: 999px;
        border: none;
        background: #4db262;
        color: white;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.268 21a2 2 0 0 0 3.464 0" />
        <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
      </svg>
    </div>
    <h1>Không có kết nối mạng</h1>
    <p>Kiểm tra kết nối Internet rồi thử lại — dữ liệu lời nhắc của bạn vẫn an toàn trên máy chủ.</p>
    <button onclick="location.reload()">Thử lại</button>
  </body>
</html>
